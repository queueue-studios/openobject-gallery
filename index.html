<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenObject Gallery</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; color: #fff;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; padding: 32px; box-sizing: border-box; text-align: center; }

    h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; margin: 0; }
    p { margin: 0; color: #9a9a9a; font-size: 0.95rem; max-width: 620px; line-height: 1.5; }
    a { color: #fff; }
  </style>
</head>
<body>
  <img src="/openobject-post-no-bills.jpg" alt="OpenObject">
  <h1>OpenObject Gallery</h1>
  <p>A public sample gallery for the OpenObject apps. Open the OpenObject app on your
     Apple TV, iPad, or iPhone with no Host on your network, and choose OpenObject Gallery.
     Learn more at <a href="https://openobject.io">openobject.io</a>.</p>
</body>
</html>
