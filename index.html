<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenObject Gallery</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; background: #000; color: #fff;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; padding: 32px; box-sizing: border-box; text-align: center; }
    img { max-width: min(100%, 1100px); height: auto; border-radius: 8px; }
    h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; margin: 4px 0 0; }
    p { margin: 0; color: #9a9a9a; font-size: 0.95rem; max-width: 620px; line-height: 1.5; }
    a { color: #fff; }
  </style>
</head>
<body>
  <main>
    <img src="/openobject-gallery-1.jpg" alt="OpenObject">
    <img src="/openobject-gallery-2.jpg" alt="OpenObject">
    <img src="/openobject-gallery-3.jpg" alt="OpenObject">
    <h1>OpenObject Gallery</h1>
    <p>A public sample gallery for the OpenObject apps. Open the OpenObject app on your
       Apple TV, iPad, or iPhone with no Host on your network, and choose OpenObject Gallery
       to see these pieces rotate. Learn more at <a href="https://openobject.io">openobject.io</a>.</p>
  </main>
</body>
</html>
